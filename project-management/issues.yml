# =============================================================================
# issues.yml
# Data source for create-issues.sh — CSCS Main Project
# =============================================================================

config:
  repo: "Ach57/cscs-db-353"
  project: "cscs-db-353"

labels:
  - name: ERD
    description: "Entity Relation Diagram"
    color: "db3c0b"
  - name: NORM
    description: "Normalization / BCNF analysis"
    color: "f9c74f"
  - name: DDL
    description: "Data Definition"
    color: "bc69e6"
  - name: TRIGGER
    description: "DB triggers"
    color: "e63946"
  - name: SEED
    description: "Initial data to populate"
    color: "add8e6"
  - name: OPS
    description: "CRUD / transaction operations"
    color: "43aa8b"
  - name: QUERY
    description: "Reporting query"
    color: "88eb2d"
  - name: GUI
    description: "Web interface"
    color: "277da1"
  - name: EMAIL
    description: "Automated email + log"
    color: "f3722c"
  - name: INTEGRITY
    description: "Integrity/constraint demo"
    color: "9b5de5"
  - name: VERIFY
    description: "Verification"
    color: "2d86eb"
  - name: REPORT
    description: "Reporting section"
    color: "eb2dd5"

issues:
  - title: "ERD-3: Extend ERD with Team, TeamFormation, Assignment, FIFA*, EmailLog"
    label: ERD
    body: |
      Add new entities to the warm-up ERD: Team, TeamFormation, TeamFormationAssignment, FIFAGame, FIFAParticipation, EmailLog.

      Acceptance criteria: All new entities/relationships added with keys and cardinalities; boys/girls team constraint and 3-hour conflict rule noted as business rules (not enforceable in the diagram itself).

  - title: "ERD-4: Group review of extended ERD"
    label: ERD
    body: |
      Walk the extended diagram against the spec as a group. Resolve open questions before DDL.

      Acceptance criteria: Signed-off ERD, no open questions.

  - title: "NORM-1: 3NF / BCNF analysis"
    label: NORM
    body: |
      For every relation (old + new), confirm 3NF. Check BCNF; where not in BCNF, explain why and show 3NF still holds.

      Acceptance criteria: Written analysis per relation, ready to paste into report.

  - title: "DDL-3: Extend 01_schema.sql"
    label: DDL
    body: |
      Add CREATE TABLE statements for Team, TeamFormation, TeamFormationAssignment, FIFAGame, FIFAParticipation, EmailLog.

      Acceptance criteria: Script runs clean on top of warm-up schema, no orphaned FKs, keys/types documented.

  - title: "DDL-4: Peer review extended schema"
    label: DDL
    body: |
      Second teammate checks new tables against spec constraints (role exclusivity, boys/girls, unique keys, etc.).

      Acceptance criteria: PR approved with checklist; gaps get a follow-up commit before merge.

  - title: "TRIGGER-1: Formation conflict trigger"
    label: TRIGGER
    body: |
      Reject a club member assignment to a formation if they're already assigned same day with less than 3 hours between start times.

      Acceptance criteria: BEFORE INSERT/UPDATE trigger; tested with a passing and a rejected case.

  - title: "SEED-2: Extend seed data"
    label: SEED
    body: |
      Add rows for teams, formations, assignments, FIFA games/participation, email log — enough to make every query below return ≥5 rows.

      Acceptance criteria: Every new table ≥10 rows, shaped to satisfy all query thresholds.

  - title: "OPS-1: Location CRUD"
    label: OPS
    body: |
      Create/Delete/Edit/Display a Location.
      Acceptance criteria: All 4 operations work and are wired to the GUI.

  - title: "OPS-2: Personnel CRUD"
    label: OPS
    body: |
      Create/Delete/Edit/Display a Personnel.
      Acceptance criteria: All 4 operations work; SSN/Medicare# uniqueness enforced.

  - title: "OPS-3: FamilyMember CRUD"
    label: OPS
    body: |
      Create/Delete/Edit/Display a FamilyMember (Primary/Secondary).
      Acceptance criteria: All 4 operations work and are wired to the GUI.

  - title: "OPS-4: ClubMember CRUD"
    label: OPS
    body: |
      Create/Delete/Edit/Display a ClubMember (Major/Minor).
      Acceptance criteria: Minor requires a linked FamilyMember; min age 4 enforced.

  - title: "OPS-5: TeamFormation CRUD"
    label: OPS
    body: |
      Create/Delete/Edit/Display a TeamFormation.
      Acceptance criteria: Boys/girls homogeneity enforced on save.

  - title: "OPS-6: Assign club member to a team formation"
    label: OPS
    body: |
      Assign/Delete/Edit a club member to a formation. Test with a conflicting same-day assignment (< 3hr gap) and confirm rejection.

      Acceptance criteria: Conflict case demonstrably rejected via TRIGGER-1.

  - title: "OPS-7: Make payment for a club member"
    label: OPS
    body: |
      Record a payment (date, amount, method, membership year).
      Acceptance criteria: Fee/donation split correct on save (excess over cap = donation, computed not stored).

  - title: "QUERY-8: Locations with ≥2 FIFA participants"
    label: QUERY
    body: |
      Location details + GM name, minor/major member counts, FIFA participant count. Sort descending by FIFA participant count.
      Acceptance criteria: Correct counts on current (non-historical) data; verified by hand against seed data.

  - title: "QUERY-9: Primary family members with ≥2 FIFA-participating children"
    label: QUERY
    body: |
      Family member name + for each qualifying child: membership #, name, DOB, relationship. Sort ascending by first name then last name.
      Acceptance criteria: HAVING COUNT ≥ 2 on FIFA participants per family member.

  - title: "QUERY-10: Team formations for a location and date range"
    label: QUERY
    body: |
      Head coach, session start time, address, type (training/game), team name, score, roster with roles. Sort ascending by start time.
      Acceptance criteria: Score null for future sessions; date range parameterized.

  - title: "QUERY-11: Members with ≥5 FIFA games"
    label: QUERY
    body: |
      Membership #, name, game count, min/max year played. Sort descending by game count.
      Acceptance criteria: HAVING COUNT(*) >= 5.

  - title: "QUERY-12: Formation report by location and date range"
    label: QUERY
    body: |
      Per location: training session count + player count, game session count + player count. Only locations with ≥4 game sessions. Sort descending by game session count.
      Acceptance criteria: Correct split between training vs game sessions.

  - title: "QUERY-13: Active members never in a formation but with ≥1 FIFA game"
    label: QUERY
    body: |
      Membership #, name, age, phone, email, FIFA game count, current location. Sort ascending by location then FIFA game count.
      Acceptance criteria: LEFT JOIN + IS NULL against TeamFormationAssignment; active status derived.

  - title: "QUERY-14: Major members who were minors when they joined"
    label: QUERY
    body: |
      Membership #, name, status, join date, age, phone, email, current location. Sort ascending by location then age.
      Acceptance criteria: Join date/age-at-join computed correctly from DOB.

  - title: "QUERY-15: Active members who have only ever played Goalkeeper"
    label: QUERY
    body: |
      Membership #, name, age, phone, email, current location, FIFA game count. Must have ≥1 Goalkeeper assignment, zero of any other role. Sort ascending by location then membership #.
      Acceptance criteria: NOT EXISTS subquery for "any other role" case.

  - title: "QUERY-16: Active members assigned to all 5 given roles"
    label: QUERY
    body: |
      Members assigned at least once each to Goalkeeper, Right fullback, Sweeper, Defending, Striker. Sort ascending by location then membership #.
      Acceptance criteria: HAVING COUNT(DISTINCT role) covers all 5 required roles.

  - title: "QUERY-17: Family members who are also head coaches at their location"
    label: QUERY
    body: |
      Given a location: family members with an active club member there who are also head coach of ≥1 formation at that location. Name + phone.
      Acceptance criteria: Correct join between FamilyMember and TeamFormation.head_coach.

  - title: "QUERY-18: Active members who never won a game"
    label: QUERY
    body: |
      Membership #, name, age, phone, email, current location. Must have ≥1 game assignment, no game where their team's score was higher. Sort ascending by location then membership #.
      Acceptance criteria: Correct score comparison per team per session.

  - title: "QUERY-19: Volunteer personnel who are family members with FIFA-participating minors"
    label: QUERY
    body: |
      Volunteer's name, minor member count, FIFA-participant count, phone, email, current location, role. Sort ascending by location, role, first name, last name.
      Acceptance criteria: Join Personnel(volunteer) → FamilyMember (same person) → ClubMember → FIFAParticipation.

  - title: "EMAIL-1: Weekly session email + log"
    label: EMAIL
    body: |
      Generate emails for the coming week's sessions (subject format, body per spec). Write each to EmailLog (date, sender location, receiver, subject, first 100 chars of body).
      Acceptance criteria: Subject/body match spec format exactly; log populated per email sent.

  - title: "GUI-1: CRUD screens (OPS-1 to OPS-7)"
    label: GUI
    body: |
      Build screens for Location, Personnel, FamilyMember, ClubMember, TeamFormation, Assignment, Payment.
      Acceptance criteria: Each screen covers Create/Delete/Edit/Display where applicable; connects to AITS.

  - title: "GUI-2: Reports screen (QUERY-8 to QUERY-19)"
    label: GUI
    body: |
      Build a way to run and display each report query from the GUI.
      Acceptance criteria: All 12 queries reachable and readable from the UI.

  - title: "INTEGRITY-1: Demonstrate constraint enforcement"
    label: INTEGRITY
    body: |
      Prepare a live demo script proving key constraints hold: formation conflict rejection, unique SSN/Medicare#, boys/girls team rule, min age 4.
      Acceptance criteria: Each case has a "should fail" input ready to run on demo day.

  - title: "VERIFY-1: AITS connection + count checks"
    label: VERIFY
    body: |
      Confirm GUI/backend connects to AITS MySQL (not local) and run SELECT COUNT(*) for every table.
      Acceptance criteria: Connection verified from a lab PC; counts captured for the report.

  - title: "REPORT-2: Assemble final PDF"
    label: REPORT
    body: |
      Combine cover page (Group/Team ID, member names/IDs), signed originality form, CONTRIBUTIONS section, assumptions, ERD, E/R→relation conversion + FDs/keys, normalization/BCNF analysis, DDL, all 22 operations with ≥5 result rows each, trigger explanation, GUI screenshots.
      Acceptance criteria: Single PDF, uploaded to Moodle before August 7, 23:55.
